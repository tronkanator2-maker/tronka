name: Verify bot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: world_models_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d world_models_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Compile Telegram server
        run: bun build --target=bun bot.ts --outdir /tmp/world-models-check
      - name: Test domain and privacy modules
        run: bun test tests
      - name: Test real PostgreSQL contracts
        env:
          PGTEST_DATABASE_URL: postgres://ci_user:ci_password_only@127.0.0.1:5432/world_models_ci
        run: bun test integration
      - name: Verify no known secrets in source
        shell: bash
        run: |
          if grep -RnE '^[[:space:]]*(BOT_TOKEN|DATABASE_URL|WEBHOOK_SECRET)[[:space:]]*[:=][[:space:]]*["\x27][[:digit:]]{6,}' --include='*.ts' .; then
            echo "Potential embedded secret detected"
            exit 1
          fi
